name: Desktop package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/desktop-package.yml"
      - "rust-toolchain.toml"
      - "pyproject.toml"
      - "Engineering/**"
      - "Frontend/**"
      - "Scripts/package-desktop.ps1"
  pull_request:
    paths:
      - ".github/workflows/desktop-package.yml"
      - "rust-toolchain.toml"
      - "pyproject.toml"
      - "Engineering/**"
      - "Frontend/**"
      - "Scripts/package-desktop.ps1"

permissions:
  contents: read

concurrency:
  group: desktop-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-package:
    name: Windows x64 NSIS
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.0-x86_64-pc-windows-msvc --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0-x86_64-pc-windows-msvc

      - name: Install Python and npm prerequisites
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e ".[dev]"
          npm install --global npm@11.16.0

      - name: Build and verify unsigned release packages
        run: ./Scripts/package-desktop.ps1

      - name: Record checksums in job summary
        run: |
          "### E-011 desktop package checksums" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "``````text" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Get-Content release/checksums/SHA256SUMS | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload verified unsigned packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: universal-prompt-studio-windows-x64-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
