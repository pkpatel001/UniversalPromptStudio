[package]
name = "universal-prompt-studio"
version = "0.2.0-alpha"
description = "Universal Prompt Studio desktop application"
authors = ["The Patel Brothers Creative Solutions"]
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/pkpatel001/UniversalPromptStudio"

[lib]
name = "universal_prompt_studio_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
